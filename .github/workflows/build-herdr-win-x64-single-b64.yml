name: build-herdr-win-x64-single-b64

on:
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Build herdr (win x64) + base64 single pack -> dl branch
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      RUST_TOOLCHAIN_VERSION: 1.96.1

    steps:
      # herdr 仓库自带 scripts/package_windows_conpty.* 与 packaging/windows/conpty.json（Windows ConPTY bundle 必需）
      - name: Checkout upstream herdrdev/herdr
        uses: actions/checkout@v4
        with:
          repository: herdrdev/herdr
          persist-credentials: false

      - name: Rust toolchain 1.96.1 (win msvc target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc

      # herdr 内嵌 libghostty-vt（Zig 编译），官方固定 Zig 0.16.0
      - name: Install Zig 0.16.0
        uses: vercel-labs/setup-zig@v1.0.2
        with:
          version: 0.16.0

      - name: Remove Zig caches (fresh)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force .zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/.zig-cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force vendor/libghostty-vt/zig-out -ErrorAction SilentlyContinue

      - name: Cargo build herdr.exe
        shell: pwsh
        env:
          LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
          LIBGHOSTTY_VT_SIMD: "true"
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      # Windows 产物 = herdr.exe + conpty/（conpty.dll + OpenConsole.exe），官方脚本从微软 ConPTY nupkg 打包并校验签名
      - name: Package Windows ConPTY bundle (herdr-windows-x86_64.zip)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\x86_64-pc-windows-msvc\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath herdr-windows-x86_64.zip
          Get-Item herdr-windows-x86_64.zip | Select-Object Name, Length

      # 单文件：把官方 zip 直接 base64（zip 已是压缩包，无需再 tar.gz）
      - name: Package & base64 single file (herdr.b64)
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $PWD "herdr-windows-x86_64.zip"
          $b64 = Join-Path $PWD "herdr.b64"
          $bytes = [IO.File]::ReadAllBytes($zip)
          [IO.File]::WriteAllText($b64, [Convert]::ToBase64String($bytes), [Text.Encoding]::ASCII)
          Get-Item $zip, $b64 | Select-Object Name, Length
          # 还原说明（随单文件一起推到 dl 分支）——用逐行写，避免 here-string 缩进破坏 YAML
          $restore = @(
            "还原 herdr.b64：",
            "  base64 -d herdr.b64 > herdr-windows-x86_64.zip",
            "  unzip herdr-windows-x86_64.zip     # 得到 herdr.exe + conpty/（官方 Windows 包结构）",
            "PowerShell:",
            "  [IO.File]::WriteAllBytes('herdr-windows-x86_64.zip',[Convert]::FromBase64String((Get-Content herdr.b64 -Raw)))",
            "  Expand-Archive herdr-windows-x86_64.zip"
          )
          Set-Content -Path (Join-Path $PWD "herdr-restore.txt") -Value $restore -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist" | Out-Null
          Copy-Item $b64, (Join-Path $PWD "herdr-restore.txt") "$env:GITHUB_WORKSPACE\dist\"
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist" | Select-Object Name, Length
          Write-Output "dist=$env:GITHUB_WORKSPACE\dist" >> $env:GITHUB_OUTPUT

      - name: Upload as backup artifact (safety net)
        uses: actions/upload-artifact@v4
        with:
          name: herdr-win-x64-single-b64
          path: ${{ steps.pkg.outputs.dist }}/*
          if-no-files-found: error

      - name: Push single b64 to dl branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 以 orphan 方式重写 dl 分支，只保留本次单文件（每次构建覆盖旧版本）
          git checkout --orphan dl
          git rm -rf . 2>$null | Out-Null
          Copy-Item dist\herdr.b64, dist\herdr-restore.txt . -Force
          git add herdr.b64 herdr-restore.txt
          git commit -m "herdr win x64 build #${{ github.run_number }} (single base64)" 2>$null | Out-Null
          git remote set-url origin "https://x-access-token:${env:GITHUB_TOKEN}@github.com/${env:GITHUB_REPOSITORY}.git"
          git push --force origin dl
          Write-Output "Pushed dl branch: $((git ls-files).Count) files"
